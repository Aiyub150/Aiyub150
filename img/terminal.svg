<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" height="100%">
  <defs>
    <style>
      .t-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .t-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .t-bold { font-weight: 600; }
      .t-prompt { fill: #38bdae; font-weight: 600; }
      .t-cmd { fill: #f0f6fc; font-weight: 600; }
      .t-muted { fill: #8b949e; }
      .t-body { fill: #c9d1d9; font-size: 13.5px; }
      .t-status { fill: #79c0ff; font-size: 13px; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <g filter="url(#shadow)">
    <rect x="2" y="2" width="876" height="346" rx="8" ry="8" fill="#090d13" stroke="#30363d" stroke-width="1.2"/>
  </g>

  <!-- Header Bar -->
  <path d="M 2 10 Q 2 2 10 2 L 870 2 Q 878 2 878 10 L 878 36 L 2 36 Z" fill="#161b22"/>
  <line x1="2" y1="36" x2="878" y2="36" stroke="#21262d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="22" cy="19" r="5.5" fill="#ff5f56"/>
  <circle cx="38" cy="19" r="5.5" fill="#ffbd2e"/>
  <circle cx="54" cy="19" r="5.5" fill="#27c93f"/>

  <!-- Title -->
  <text x="74" y="23" class="t-mono" font-size="12" fill="#8b949e">bash — aiyub@workspace: ~</text>

  <!-- Body Content -->
  <!-- Line 1: whoami -->
  <text x="24" y="66" class="t-mono" font-size="13.5">
    <tspan class="t-prompt">aiyub@workspace:~$</tspan> <tspan class="t-cmd">whoami</tspan>
  </text>
  <text x="24" y="88" class="t-mono t-muted" font-size="13.5">Aiyub Heriyanto — Software Engineer &amp; Hardware Tinkerer</text>

  <!-- Line 2: cat about.txt -->
  <text x="24" y="122" class="t-mono" font-size="13.5">
    <tspan class="t-prompt">aiyub@workspace:~$</tspan> <tspan class="t-cmd">cat about.txt</tspan>
  </text>
  <text x="24" y="146" class="t-sans t-body">Hey! I'm Aiyub. Most of my days are spent in backend engineering (Go &amp; Laravel), architecting web apps,</text>
  <text x="24" y="166" class="t-sans t-body">and tinkering with hardware (IoT, microcontrollers, and computer vision on edge devices).</text>
  
  <text x="24" y="196" class="t-sans t-body">I value clean, fast, and maintainable systems over unnecessary complexity or over-engineering.</text>
  <text x="24" y="216" class="t-sans t-body">Outside the terminal, I'm usually soldering circuits, exploring robotics, or experimenting with new AI tools.</text>

  <!-- Line 3: status.sh -->
  <text x="24" y="254" class="t-mono" font-size="13.5">
    <tspan class="t-prompt">aiyub@workspace:~$</tspan> <tspan class="t-cmd">./status.sh</tspan>
  </text>
  <text x="24" y="278" class="t-mono t-status">[OK] Location       : East Java / Nusantara, ID</text>
  <text x="24" y="298" class="t-mono t-status">[OK] Daily Drivers  : Go, Laravel, React, Python, C/C++</text>
  <text x="24" y="318" class="t-mono t-status">[OK] Current Vibe   : Building &amp; refining full-stack services &amp; edge models</text>
</svg>